[package]
name = "sonora"
version = "0.1.1"
description = "Sonora app"
authors = ["Yuri Ribeiro"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sonora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
hound = "3.5.1"
rusqlite_migration = "1.2"
lazy_static = "1.4" # Gerencia as migrações globais
sentry = "0.49.1"

# O Plugin oficial para os Global Hotkeys exigidos pela arquitetura
tauri-plugin-global-shortcut = "2"

# Dependências vitais (Audio Engine, DB e Concorrência)
tokio = { version = "1.37", features = ["full"] }
cpal = "0.15"
crossbeam = "0.8"
dashmap = "5.5"
parking_lot = "0.12"
uuid = { version = "1.8", features = ["v4"] }
rubato = "0.14"
rusqlite = { version = "0.31", features = ["bundled"] }
symphonia = { version = "0.5", features = ["all"] }
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2.4.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
